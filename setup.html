<!doctype html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Setup - SecureBallot Multi-Org</title>
<link rel="stylesheet" href="style.css" />
<script>
function checkOnline(){
 if(!navigator.onLine){
  document.body.innerHTML=`<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0f2a5a;color:white;text-align:center;padding:20px"><div><h1>🔴 No Internet - Online Only</h1><button onclick="location.reload()" style="padding:12px 20px;border-radius:8px;border:none;margin-top:20px;font-weight:bold">Retry</button></div></div>`;
  return false;
 } return true;
}
window.addEventListener("load", checkOnline);
window.addEventListener("offline", checkOnline);
window.addEventListener("online", ()=>location.reload());
</script>
<style>.hidden{display:none}</style>
</head>
<body>
<div class="header"><h2>🔒 SecureBallot - Organization Setup</h2></div>
<div class="container">
<div class="card" style="border:2px solid #c0392b">
<div id="setupHeader">
<h1>⚙️ First Time Setup - Create Super Admin</h1>
<p style="color:#c0392b">Each organization sets up once. If org exists, setup locks for that org.</p>
</div>

<div id="setupForm">
<input type="text" id="orgName" placeholder="Organization Name (e.g. KAFU University)" />
<input type="text" id="superUser" placeholder="Super Admin Username" />
<input type="email" id="superEmail" placeholder="Super Admin Email" />
<input type="text" id="superPhone" placeholder="Phone 07..." />
<input type="password" id="superPass" placeholder="Password Min 8 chars" />
<input type="password" id="superPass2" placeholder="Confirm Password" />
<button onclick="createSuperAdmin()" class="vote-btn">Create Organization & Super Admin →</button>
<p id="setupMsg"></p>
</div>

<div id="alreadySetup" class="hidden">
<h2 style="color:#27ae60">✅ System Already Setup in Cloud</h2>
<p>Super Admin exists in <b>ballot-da7cb</b>. Setup locked on all devices.</p>
<p>Go to <a href="admin-login.html">Admin Login</a></p>
<p>Super Admin: <b id="existingAdmin"></b></p>
<p>Organization: <b id="existingOrg"></b></p>
<p id="similarReason" style="margin-top:12px;padding:10px;background:#fff3cd;border-left:4px solid #f39c12;color:#856404;"></p>
</div>
</div>
</div>

<script type="module">
import { db, ref, get, set } from "./firebase-config.js";

function isSimilarOrg(a,b){
 if(!a||!b) return false;
 a=a.toLowerCase().trim(); b=b.toLowerCase().trim();
 if(a===b) return true;
 if(a.includes(b) || b.includes(a)) return true;
 if(a.replace(/\s+/g,'') === b.replace(/\s+/g,'')) return true;
 return false;
}
function slugify(name){ return name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); }

async function showLockedScreen(existingOrgName, adminName, attemptedOrg){
 document.getElementById("setupForm").classList.add("hidden");
 document.getElementById("setupHeader").classList.add("hidden");
 const box = document.getElementById("alreadySetup");
 box.classList.remove("hidden");
 document.getElementById("existingAdmin").innerText = adminName;
 document.getElementById("existingOrg").innerText = existingOrgName;
 const reason = document.getElementById("similarReason");
 reason.innerHTML = `⚠️ You attempted '<b>${attemptedOrg}</b>' which is similar to existing organization '<b>${existingOrgName}</b>'. This org is already registered in the country-wide system.`;
}

window.createSuperAdmin = async function(){
 if(!navigator.onLine){ alert("🔴 Online only"); return; }
 const org = document.getElementById("orgName").value.trim();
 const user = document.getElementById("superUser").value.trim();
 const email = document.getElementById("superEmail").value.trim();
 const phone = document.getElementById("superPhone").value.trim();
 const pass = document.getElementById("superPass").value;
 const pass2 = document.getElementById("superPass2").value;
 const msgEl = document.getElementById("setupMsg");

 if(!org || user.length<4 ||!email.includes("@") || phone.length<9 || pass.length<8){ msgEl.innerText="❌ Fill all correctly"; return; }
 if(pass!==pass2){ msgEl.innerText="❌ Passwords don't match"; return; }
 msgEl.innerText="Checking cloud across all organizations...";

 try{
  // 1. CHECK ALL ORGS IN COUNTRY FOR SIMILAR NAME
  const orgsSnap = await get(ref(db, `orgs`));
  const adminsSnap = await get(ref(db, `admins`));
  const allOrgs = orgsSnap.val() || {};

  for(let key in allOrgs){
   const existingOrgName = allOrgs[key].name;
   if(isSimilarOrg(existingOrgName, org)){
    // FOUND SIMILAR → SHOW YOUR GREEN SCREEN
    const existingOrg = allOrgs[key];
    // find super admin for that org
    let adminName = existingOrg.superAdmin || "cliford_admin";
    if(adminsSnap.exists()){
     const admins = Object.values(adminsSnap.val());
     const found = admins.find(a=> a.org && isSimilarOrg(a.org, existingOrgName));
     if(found) adminName = found.username;
    }
    await set(ref(db, `audit/${Date.now()}`), {
     user: user.toUpperCase(),
     action: `BLOCKED MULTI-ORG - Tried '${org}' similar to existing '${existingOrgName}'`,
     time: new Date().toLocaleString(),
    });
    showLockedScreen(existingOrgName, adminName, org);
    return;
   }
  }

  // 2. Also check old single org node for backward compatibility
  const oldOrgSnap = await get(ref(db, `org`));
  if(oldOrgSnap.exists() && isSimilarOrg(oldOrgSnap.val().name, org)){
   showLockedScreen(oldOrgSnap.val().name, "cliford_admin", org);
   return;
  }

  // 3. Check username taken
  if(adminsSnap.exists() && adminsSnap.val()[user]){
   msgEl.innerText="❌ Username already taken nationwide, choose another"; return;
  }

  // 4. CREATE NEW ORG - ALLOW IT (new client)
  const orgSlug = slugify(org);
  const superAdmin = {
   username: user, password: btoa(pass), role:"superadmin",
   email: email, phone: phone, org: org, orgSlug: orgSlug,
   created: new Date().toLocaleString(), is_active:true
  };

  // Save in multi-org structure
  await set(ref(db, `admins/${user}`), superAdmin);
  await set(ref(db, `orgs/${orgSlug}`), {
   name: org, slug: orgSlug, superAdmin: user,
   email: email, phone: phone,
   setupAt: new Date().toLocaleString(),
   setupBy: user
  });
  // Keep old node for compatibility if first org
  if(!oldOrgSnap.exists()){
   await set(ref(db, `org`), { name: org, setupAt: new Date().toLocaleString() });
  }
  await set(ref(db, `audit/${Date.now()}`), {
   user: user.toUpperCase(),
   action: `NEW ORG REGISTERED - ${org} (${orgSlug}) by ${user}`,
   time: new Date().toLocaleString(),
  });

  msgEl.innerHTML=`✅ <b>${org}</b> Created! New organization added to country system.<br>Redirecting to login...`;
  setTimeout(()=>{ window.location.href="admin-login.html?org="+orgSlug; },2000);

 }catch(e){
  console.error(e);
  msgEl.innerText="❌ Error: "+e.message;
 }
};

// No auto-lock on load for multi-org, only when similar attempted
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<script>
function checkOnline(){
 if(!navigator.onLine){
  document.body.innerHTML=`<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0f2a5a;color:white;text-align:center;padding:20px;font-family:sans-serif"><div><h1>🔴 No Internet</h1><p>Connect</p></div></div>`;
  return false;
 } return true;
}
window.addEventListener("load", checkOnline);
window.addEventListener("offline", checkOnline);
window.addEventListener("online", ()=>location.reload());
setInterval(checkOnline,3000);
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Results - Institution Locked</title>
<link rel="stylesheet" href="style.css" />
<style>
select{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;background:#e9ecef;font-weight:bold;cursor:not-allowed}
.locked{border:2px solid #c0392b!important}
.msg-locked{background:#f8d7da;border:2px solid #c0392b;padding:12px;border-radius:8px;color:#721c24;font-size:13px;margin:10px 0}
.msg-ok{background:#d4edda;border:1px solid #27ae60;padding:10px;border-radius:8px;font-size:13px}
.badge-winner{background:#27ae60;color:white;padding:2px 8px;border-radius:10px;font-size:11px}
</style>
</head>
<body>
<div class="header">
<h2>Live Results - Institution Locked</h2>
<div style="display:flex;gap:8px;align-items:center">
<span id="orgInfo" style="color:#2ecc71;background:#0a1e3c;padding:4px 8px;border-radius:6px"></span>
<a href="index.html" style="color:white">← Vote</a>
</div>
</div>
<div class="container">
<div class="card">
<h1>Live Count - Restricted to Your Institution</h1>
<div id="accessInfo"></div>
<select id="orgSelect" disabled><option>Loading...</option></select>
<p style="font-size:12px">Organization: <b id="orgDisplay">Loading</b></p>
<div id="resultsContainer">Loading...</div>
<p id="resultTotal" style="margin-top:15px;font-weight:bold"></p>
<div id="summaryBox" style="margin-top:20px;padding:15px;background:#f8f9fa;border-radius:10px;border:2px dashed #0f2a5a">
<h3>📋 Rank Summary</h3>
<div id="rankSummary"></div>
</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:15px">
<button onclick="exportFullDetails()" style="background:#8e44ad;color:white;padding:10px 16px;border-radius:8px;border:none;font-weight:bold">📥 Export FULL CSV (Your Org Only)</button>
<button onclick="exportRankSummary()" style="background:#27ae60;color:white;padding:10px 16px;border-radius:8px;border:none;font-weight:bold">🏆 Export Rank CSV</button>
<button onclick="clearResults()" id="clearBtn" style="background:#c0392b;color:white;padding:10px 16px;border-radius:8px;border:none">🗑️ Clear Votes (Your Org Only)</button>
</div>
</div>
</div>

<script type="module">
import { db, ref, get, remove, onValue } from "./firebase-config.js";

// ==== ONLY THESE EMAILS CAN SEE ALL ORGS (YOU) ====
const GLOBAL_MASTERS = ["cliford@gmail.com","clifordtech@gmail.com","admin@secureballot.co.ke"];
// ===================================================

const role = localStorage.getItem("sb_admin_role") || "";
const adminOrgSlug = localStorage.getItem("sb_admin_orgSlug") || "";
const adminOrgName = localStorage.getItem("sb_admin_org") || "";
const adminEmail = (localStorage.getItem("sb_admin_email")||"").toLowerCase();

if(!adminOrgSlug){
  document.body.innerHTML=`<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0f2a5a;color:white;text-align:center;padding:20px"><div><h1>🔒 Login Required</h1><a href="admin-login.html" style="background:white;color:#0f2a5a;padding:12px 20px;border-radius:8px;text-decoration:none;font-weight:bold">Admin Login</a></div></div>`;
  throw new Error("No org");
}

let currentOrgSlug = adminOrgSlug;
let currentOrgName = adminOrgName;
let currentData = {};
let isGlobalMaster = GLOBAL_MASTERS.includes(adminEmail);

function slugify(n){ return n.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,''); }
function esc(s){ if(s==null) return '""'; return '"'+String(s).replace(/"/g,'""')+'"'; }
function isForMyOrg(item){ if(!item) return false; return item.orgSlug===currentOrgSlug; }

async function loadOrgs(){
 const orgsSnap=await get(ref(db,"orgs"));
 const allOrgs=orgsSnap.val()||{};
 const sel=document.getElementById("orgSelect");
 const accessDiv=document.getElementById("accessInfo");

 if(isGlobalMaster){
   // YOU - Platform Owner
   let opts=`<option value="">-- All Organizations (YOU ARE PLATFORM OWNER) --</option>`;
   Object.values(allOrgs).forEach(o=>{ opts+=`<option value="${o.slug}">${o.name}</option>`; });
   sel.innerHTML=opts;
   sel.disabled=false;
   sel.classList.remove("locked");
   currentOrgSlug = ""; // default all
   accessDiv.innerHTML=`<div class="msg-ok">🔓 Platform Owner: ${adminEmail} - You can see ALL orgs. All other Super Admins are locked.</div>`;
   const urlParams=new URLSearchParams(window.location.search);
   if(urlParams.get("org") && allOrgs[urlParams.get("org")]){
     sel.value=urlParams.get("org");
     currentOrgSlug=urlParams.get("org");
     currentOrgName=allOrgs[currentOrgSlug].name;
   } else {
     currentOrgName="All Organizations";
   }
   sel.addEventListener("change", e=>{
     currentOrgSlug=e.target.value;
     currentOrgName=currentOrgSlug? allOrgs[currentOrgSlug].name : "All Organizations";
     document.getElementById("orgDisplay").innerText=currentOrgName;
     document.getElementById("orgInfo").innerText=currentOrgName;
     loadResults();
   });
 } else {
   // EVERYONE ELSE - EVEN SUPER ADMIN AT KISIWA - LOCKED TO OWN ORG
   sel.innerHTML=`<option value="${adminOrgSlug}">${adminOrgName} - LOCKED (Cannot view other institutions)</option>`;
   sel.value=adminOrgSlug;
   sel.disabled=true;
   sel.classList.add("locked");
   currentOrgSlug=adminOrgSlug;
   currentOrgName=adminOrgName;
   accessDiv.innerHTML=`<div class="msg-locked">🔒 <b>INSTITUTION ISOLATED:</b> You are <b>${role}</b> of <b>${adminOrgName}</b> (${adminEmail||'superadmin'}).<br>⛔ You CANNOT see Marble Capital, KISS, or any other institution.<br>Even if you are Super Admin at Kisiwa, you can ONLY see Kisiwa data. Marble's Super Admin can ONLY see Marble data.</div>`;
 }

 document.getElementById("orgDisplay").innerText=currentOrgName;
 document.getElementById("orgInfo").innerText=currentOrgName;
 loadResults();
}

function loadResults(){
 if(!isGlobalMaster){ currentOrgSlug=adminOrgSlug; currentOrgName=adminOrgName; }
 onValue(ref(db, "votes"), async (snap)=>{
  const allVotes=snap.val()||{};
  const votes = currentOrgSlug? Object.fromEntries(Object.entries(allVotes).filter(([k,v])=>isForMyOrg(v))) : allVotes;
  const candSnap=await get(ref(db,"candidates"));
  const allCands=candSnap.val()||{};
  const candData = currentOrgSlug? Object.fromEntries(Object.entries(allCands).filter(([k,v])=>isForMyOrg(v))) : allCands;
  currentData.votes=votes; currentData.candData=candData; currentData.total=Object.keys(votes).length;

  if(Object.keys(candData).length===0){
   document.getElementById("resultsContainer").innerHTML=`<div style="text-align:center;padding:20px">No candidates for <b>${currentOrgName}</b>. Other institutions' candidates are hidden.</div>`;
   document.getElementById("resultTotal").innerText=`Total Votes in ${currentOrgName}: ${currentData.total}`;
   document.getElementById("rankSummary").innerHTML="No candidates";
   return;
  }
  const byPost={};
  Object.values(candData).forEach(c=>{ if(!byPost[c.postId]) byPost[c.postId]={postId:c.postId, name:c.postName, cands:{}}; byPost[c.postId].cands[c.id]={...c, count:0, rank:0, percentage:0}; });
  Object.values(votes).forEach(v=>{ if(byPost[v.postId] && byPost[v.postId].cands[v.candidateId]) byPost[v.postId].cands[v.candidateId].count++; });
  Object.values(byPost).forEach(post=>{
   const total=Object.values(post.cands).reduce((s,x)=>s+x.count,0);
   Object.values(post.cands).sort((a,b)=>b.count-a.count).forEach((c,i)=>{ c.rank=i+1; c.percentage=total?Math.round((c.count/total)*100):0; byPost[post.postId].cands[c.id]=c; });
  });
  currentData.byPost=byPost;

  let html="", rankHtml=`<table style="width:100%;border-collapse:collapse;font-size:13px"><tr style="background:#0f2a5a;color:white"><th style="padding:6px;border:1px solid #ddd">Post</th><th style="padding:6px;border:1px solid #ddd">Rank</th><th style="padding:6px;border:1px solid #ddd">Candidate</th><th style="padding:6px;border:1px solid #ddd">Votes</th><th style="padding:6px;border:1px solid #ddd">Status</th></tr>`;
  Object.values(byPost).forEach(post=>{
   const postTotal=Object.values(post.cands).reduce((s,x)=>s+x.count,0);
   html+=`<div style="margin:20px 0;padding:15px;border:2px solid #0f2a5a;border-radius:10px"><h3 style="background:#0f2a5a;color:white;padding:8px;border-radius:6px">🗳️ ${post.name} - ${postTotal} votes - ${currentOrgName}</h3>`;
   Object.values(post.cands).sort((a,b)=>a.rank-b.rank).forEach(c=>{
    const isW=c.rank===1 && c.count>0;
    html+=`<div style="margin:8px 0;padding:8px;border-radius:6px;border:1px solid #ddd;${isW?'background:#e8f5e9;border:2px solid #27ae60':''}"><div style="display:flex;justify-content:space-between"><div style="display:flex;gap:8px"><img src="${c.photo}" width="40" height="40" style="border-radius:50%"><div><b>#${c.rank} ${c.name} ${isW?'<span class=badge-winner>WINNER</span>':''}</b><br><small>${c.party}</small></div></div><b>${c.count} (${c.percentage}%)</b></div></div>`;
    rankHtml+=`<tr style="${isW?'background:#e8f5e9;font-weight:bold':''}"><td style="padding:6px;border:1px solid #ddd">${post.name}</td><td style="padding:6px;border:1px solid #ddd">#${c.rank}</td><td style="padding:6px;border:1px solid #ddd">${c.name}</td><td style="padding:6px;border:1px solid #ddd">${c.count}</td><td style="padding:6px;border:1px solid #ddd">${isW?'WINNER':''}</td></tr>`;
   });
   html+=`</div>`;
  });
  rankHtml+=`</table>`;
  document.getElementById("resultsContainer").innerHTML=html;
  document.getElementById("resultTotal").innerText=`Total Votes in ${currentOrgName}: ${currentData.total} (Other institutions hidden)`;
  document.getElementById("rankSummary").innerHTML=rankHtml;
 });
}

window.exportFullDetails=function(){
 let csv="\uFEFF"; csv+=`${esc("Org")},${esc(currentOrgName)}\n${esc("Exported By")},${esc(adminEmail+" | "+role)}\n${esc("Date")},${esc(new Date().toLocaleString())}\n\n`;
 csv+=`${esc("Post")},${esc("Rank")},${esc("Candidate")},${esc("Party")},${esc("Votes")},${esc("%")},${esc("Status")}\n`;
 Object.values(currentData.byPost||{}).forEach(p=>{ Object.values(p.cands).sort((a,b)=>a.rank-b.rank).forEach(c=>{ csv+=`${esc(p.name)},${esc(c.rank)},${esc(c.name)},${esc(c.party)},${esc(c.count)},${esc(c.percentage+"%")},${esc(c.rank===1&&c.count>0?"WINNER":"")}\n`; }); });
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`RESULTS_${currentOrgSlug}_${Date.now()}.csv`; a.click();
};
window.exportRankSummary=window.exportFullDetails;
window.clearResults=async function(){
 const snap=await get(ref(db,"votes")); const all=snap.val()||{};
 if(!confirm(`Clear votes for ${currentOrgName} ONLY? Other institutions will NOT be affected.`)) return;
 for(let k in all){ if(isForMyOrg(all[k])) await remove(ref(db,`votes/${k}`)); }
 const vs=await get(ref(db,"voters")); const av=vs.val()||{};
 for(let k in av){ if(isForMyOrg(av[k])) await remove(ref(db,`voters/${k}`)); }
 alert("Cleared votes for "+currentOrgName+" only.");
};

loadOrgs();
</script>
</body>
</html>
